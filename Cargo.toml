[package]
name = "microflow"
description = "A robust and efficient TinyML inference engine"
authors = ["Matteo Carnelos <matteo.carnelos98@gmail.com>"]
documentation = "https://docs.rs/microflow"
repository = "https://github.com/matteocarnelos/microflow-rs"
categories = ["embedded", "no-std", "science"]
keywords = ["tinyml"]
license = "MIT OR Apache-2.0"
version = "0.1.3"
edition = "2021"
include = [
    "/src/**",
    "/benches/**",
    "/tests/**",
    "/models/**",
    "/Cargo.toml",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
]

[features]
# Generate the ping-pong buffer-reuse `predict_inner` for eligible linear-chain
# Tensor4D models, collapsing peak inference stack from the sum of intermediate
# tensors toward ~2×MAX. Off by default; behaviour is otherwise identical.
buffer-reuse = ["microflow-macros/buffer-reuse"]
# ESP32-S3 dual-core (APP-core) parallelism for inference: heavy conv/depthwise
# layers split their output rows across the two cores. Off by default, so host
# and other targets use the single-core scalar path and the nano_u fingerprint
# stays byte-unchanged. The firmware owns CPU_CTRL + the app-core stack and
# starts the second core into `multicore::worker_loop`; microflow provides the
# no-heap barrier / row-dispatch primitive. Pairs with `buffer-reuse`, which
# frees the stack the second core's output band needs. See
# docs/ESP32_S3_MULTICORE.md.
multicore = []

[dependencies]
microflow-macros = { version = "0.1", path = "microflow-macros" }
nalgebra = { version = "0.32", default-features = false, features = ["macros"] }
simba = { version = "0.8", default-features = false }
num-traits = { version = "0.2", default-features = false }
libm = "0.2"

[dev-dependencies]
csv = "1.2"
criterion = "0.5"

[[bench]]
name = "sine"
harness = false

[[bench]]
name = "speech"
harness = false

[[bench]]
name = "person_detect"
harness = false

[[bench]]
name = "nano_u"
harness = false

[workspace]
members = ["microflow-macros"]
exclude = ["examples"]

[profile.release]
lto = true
